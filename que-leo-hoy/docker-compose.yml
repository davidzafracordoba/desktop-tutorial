services:

  web:
    build: .
    container_name: queleo_web

    ports:
      - "8080:80"

    volumes:
      - ./app:/var/www/html

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql_libros

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: queleo
      MYSQL_USER: david
      MYSQL_PASSWORD: david123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin

    restart: always

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root

volumes:
  mysql_data: